<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Attendance Portal</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f4f7f6; padding: 20px; margin: 0; }
    .container { max-width: 700px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    select, input[type="date"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .attendance-box { display: none; margin-top: 15px; }
    .select-all-box { background: #e9ecef; padding: 10px; margin-bottom: 10px; border-radius: 4px; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    th { background: #007bff; color: white; }
    .btn-submit { width: 100%; background: #28a745; color: white; padding: 12px; border: none; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 15px; }
    .btn-submit:hover { background: #218838; }
    .loader { display: none; text-align: center; color: #007bff; margin: 10px 0; }
  </style>
</head>
<body>

<div class="container">
  <h2>Mark Attendance</h2>

  <div class="form-group">
    <label>Select Date:</label>
    <input type="date" id="attDate">
  </div>

  <div class="form-group">
    <label>Select Class:</label>
    <select id="classSelect" onchange="loadStudents()">
      <option value="">-- Choose Class --</option>
    </select>
  </div>

  <div id="loader" class="loader">Processing...</div>

  <div id="attendanceBox" class="attendance-box">
    <div class="select-all-box">
      <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)">
      <label for="selectAll" style="display:inline; cursor:pointer;">Select All (Present)</label>
    </div>

    <table>
      <thead>
        <tr>
          <th>Roll</th>
          <th>Name</th>
          <th>Present</th>
        </tr>
      </thead>
      <tbody id="studentList"></tbody>
    </table>

    <button class="btn-submit" onclick="submitAttendance()">Save Attendance</button>
  </div>
</div>

<script>
  // Dynamic Deployment Web App URL Yahan Set Karein
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwL1Q31ReVc8Z3fEQKGitprBdmlfaksrOL3Pk8AshQX6CPA-tlrlUdlWTsOysQny3n6/exec"; 

  window.onload = function() {
    document.getElementById("attDate").valueAsDate = new Date();
    fetchClasses();
  };

  function fetchClasses() {
    showLoader(true);
    fetch(`${SCRIPT_URL}?action=getClasses`)
      .then(res => res.json())
      .then(data => {
        showLoader(false);
        if (data.status === "success") {
          const select = document.getElementById("classSelect");
          data.classes.forEach(cls => {
            let option = document.createElement("option");
            option.value = cls;
            option.textContent = cls;
            select.appendChild(option);
          });
        }
      });
  }

  function loadStudents() {
    const className = document.getElementById("classSelect").value;
    const box = document.getElementById("attendanceBox");
    const tbody = document.getElementById("studentList");
    tbody.innerHTML = "";

    if (!className) { box.style.display = "none"; return; }

    showLoader(true);
    fetch(`${SCRIPT_URL}?action=getStudents&className=${encodeURIComponent(className)}`)
      .then(res => res.json())
      .then(data => {
        showLoader(false);
        if (data.status === "success") {
          box.style.display = "block";
          data.students.forEach(st => {
            let tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${st.rollNo}</td>
              <td>${st.name}</td>
              <td><input type="checkbox" class="student-check" data-row="${st.rowIndex}"></td>
            `;
            tbody.appendChild(tr);
          });
        }
      });
  }

  function toggleSelectAll(master) {
    document.querySelectorAll(".student-check").forEach(cb => cb.checked = master.checked);
  }

  function submitAttendance() {
    const className = document.getElementById("classSelect").value;
    const rawDate = document.getElementById("attDate").value;
    
    if(!rawDate) { alert("Please select date"); return; }
    
    const dateParts = rawDate.split("-");
    const formattedDate = `${dateParts[2]}/${dateParts[1]}/${dateParts[0]}`;

    const checkboxes = document.querySelectorAll(".student-check");
    let records = [];

    checkboxes.forEach(cb => {
      records.push({
        rowIndex: cb.getAttribute("data-row"),
        status: cb.checked ? "Present" : "Absent"
      });
    });

    showLoader(true);
    fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "saveAttendance",
        className: className,
        date: formattedDate,
        records: records
      })
    })
    .then(res => res.json())
    .then(res => {
      showLoader(false);
      alert(res.message);
    });
  }

  function showLoader(show) {
    document.getElementById("loader").style.display = show ? "block" : "none";
  }
</script>

</body>
</html>
