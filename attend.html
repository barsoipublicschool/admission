<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Attendance System</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
    }
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }
    .attendance-box {
      margin-top: 20px;
      display: none;
    }
    .select-all-container {
      background: #e9ecef;
      padding: 10px 15px;
      border-radius: 5px;
      font-weight: bold;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    tr:hover {
      background-color: #f1f1f1;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .btn-submit {
      width: 100%;
      background-color: #28a745;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
    }
    .btn-submit:hover {
      background-color: #218838;
    }
    .loader {
      text-align: center;
      display: none;
      font-size: 18px;
      color: #007bff;
      margin: 15px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Student Attendance</h2>

  <!-- Class Select -->
  <div class="form-group">
    <label for="classSelect">Select Class:</label>
    <select id="classSelect" onchange="loadStudents()">
      <option value="">-- Choose Class --</option>
    </select>
  </div>

  <div id="loader" class="loader">Loading...</div>

  <!-- Attendance List Box -->
  <div id="attendanceBox" class="attendance-box">
    <div class="select-all-container">
      <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)">
      <label for="selectAll" style="margin: 0; cursor: pointer;">Select All (Present All)</label>
    </div>

    <table>
      <thead>
        <tr>
          <th>Roll No</th>
          <th>Name</th>
          <th>Status (Present)</th>
        </tr>
      </thead>
      <tbody id="studentList">
        <!-- Dynamic Rows -->
      </tbody>
    </table>

    <button class="btn-submit" onclick="submitAttendance()">Submit Attendance</button>
  </div>
</div>

<script>
  // Apka Web App URL yahan replace karein
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzNDGJ0hRQYq092gKL7fDgdwEOHgWxpDLOWFoI9SACghFLwL5Os1zOUoH2OBfxa_reN/exec"; 

  // Page Load hone par Class Tabs fetch karein
  window.onload = function() {
    fetchClasses();
  };

  function fetchClasses() {
    showLoader(true);
    fetch(`${SCRIPT_URL}?action=getClasses`)
      .then(res => res.json())
      .then(data => {
        showLoader(false);
        if (data.status === "success") {
          const select = document.getElementById("classSelect");
          data.classes.forEach(cls => {
            let option = document.createElement("option");
            option.value = cls;
            option.textContent = cls;
            select.appendChild(option);
          });
        } else {
          alert("Error fetching classes: " + data.message);
        }
      })
      .catch(err => {
        showLoader(false);
        console.error(err);
      });
  }

  function loadStudents() {
    const className = document.getElementById("classSelect").value;
    const box = document.getElementById("attendanceBox");
    const tbody = document.getElementById("studentList");
    tbody.innerHTML = "";
    document.getElementById("selectAll").checked = false;

    if (!className) {
      box.style.display = "none";
      return;
    }

    showLoader(true);
    fetch(`${SCRIPT_URL}?action=getStudents&className=${encodeURIComponent(className)}`)
      .then(res => res.json())
      .then(data => {
        showLoader(false);
        if (data.status === "success") {
          if (data.students.length === 0) {
            alert("No students found in this class.");
            box.style.display = "none";
            return;
          }
          
          box.style.display = "block";
          data.students.forEach(st => {
            let tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${st.rollNo || '-'}</td>
              <td>${st.name}</td>
              <td>
                <input type="checkbox" class="student-check" data-row="${st.rowIndex}" data-roll="${st.rollNo}">
              </td>
            `;
            tbody.appendChild(tr);
          });
        } else {
          alert("Error loading students: " + data.message);
        }
      })
      .catch(err => {
        showLoader(false);
        console.error(err);
      });
  }

  function toggleSelectAll(master) {
    const checkboxes = document.querySelectorAll(".student-check");
    checkboxes.forEach(cb => {
      cb.checked = master.checked;
    });
  }

  function submitAttendance() {
    const className = document.getElementById("classSelect").value;
    const checkboxes = document.querySelectorAll(".student-check");
    
    if (checkboxes.length === 0) return;

    showLoader(true);

    let promises = [];

    // Existing updateStudentDetails function ka upayog karke data update kar rahe hain
    checkboxes.forEach(cb => {
      const rowIndex = cb.getAttribute("data-row");
      const rollNo = cb.getAttribute("data-roll");
      const isPresent = cb.checked ? "Present" : "Absent";

      const payload = {
        className: className,
        rowIndex: rowIndex,
        rollNo: rollNo // Re-confirming roll status
      };

      promises.push(
        fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        })
      );
    });

    Promise.all(promises)
      .then(() => {
        showLoader(false);
        alert("Attendance Processed Successfully!");
      })
      .catch(err => {
        showLoader(false);
        alert("Error submitting attendance: " + err);
      });
  }

  function showLoader(show) {
    document.getElementById("loader").style.display = show ? "block" : "none";
  }
</script>

</body>
</html>
